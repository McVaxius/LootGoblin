name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PLUGIN_NAME: LootGoblin
  SOLUTION_NAME: LootGoblin
  INTERNAL_NAME: LootGoblin
  RELEASE_DIR: LootGoblin\bin\x64\Release\LootGoblin

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          $devPath = "$env:AppData\XIVLauncher\addon\Hooks\dev\"
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/goatcorp/dalamud-distrib/4b9175ec411f15a84f4d59dc24881095aef2d999/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $devPath
          Write-Host "Expected pinned Dalamud: version 15.0.2.2, GitSha 4a6abae25b8a156a102ed3869429ef026a3d7cfe, revision 7312"

          $commitHashPath = Join-Path $devPath "commit_hash.txt"
          $revisionPath = Join-Path $devPath "revision.txt"
          if (Test-Path -LiteralPath $commitHashPath) {
            $commitHash = (Get-Content -LiteralPath $commitHashPath -Raw).Trim()
            Write-Host "commit_hash.txt: $commitHash"
          } else {
            Write-Warning "commit_hash.txt is missing from extracted Dalamud package"
          }

          if (Test-Path -LiteralPath $revisionPath) {
            $revision = (Get-Content -LiteralPath $revisionPath -Raw).Trim()
            Write-Host "revision.txt: $revision"
          } else {
            Write-Warning "revision.txt is missing from extracted Dalamud package"
          }

      - name: Build
        run: |
          dotnet restore -r win ${{ env.SOLUTION_NAME }}.sln
          dotnet build ${{ env.SOLUTION_NAME }}.sln --configuration Release -p:Platform=x64
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: |
            ${{ env.RELEASE_DIR }}\latest.zip
            ${{ env.RELEASE_DIR }}\${{ env.INTERNAL_NAME }}.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PLUGIN_NAME }}-artifact
          path: artifact

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=v0.4.2.11" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifact/latest.zip
            artifact/${{ env.INTERNAL_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
